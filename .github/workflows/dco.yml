name: DCO

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check every commit in this PR for a matching Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          range="${BASE_SHA}..${HEAD_SHA}"
          commits=$(git rev-list --no-merges "$range")

          if [ -z "$commits" ]; then
            echo "No non-merge commits in range $range; nothing to check."
            exit 0
          fi

          # GitHub-run bots (Dependabot, the github-actions bot) commit through
          # GitHub's own API with an author address only GitHub can mint
          # (<numeric-id>+<name>[bot]@users.noreply.github.com) and a
          # committer address of noreply@github.com. DCO certifies that a
          # human contributor has the right to submit the code, which doesn't
          # apply to these automated commits, so they're exempt. Scoped to
          # the two bot names this repo actually uses rather than any "[bot]"
          # suffix, so the exception can't be widened by an arbitrary author
          # name alone.
          is_exempt_bot() {
            local author_email="$1" committer_email="$2"
            [ "$committer_email" = "noreply@github.com" ] || return 1
            printf '%s\n' "$author_email" \
              | grep -qE '^[0-9]+\+(dependabot|github-actions)\[bot\]@users\.noreply\.github\.com$'
          }

          failed=0
          for sha in $commits; do
            author_email=$(git log -1 --format='%ae' "$sha")
            committer_email=$(git log -1 --format='%ce' "$sha")
            body=$(git log -1 --format='%B' "$sha")

            if is_exempt_bot "$author_email" "$committer_email"; then
              echo "$sha: ok (exempt bot commit: $author_email)"
              continue
            fi

            match=$(printf '%s\n' "$body" | grep -iE "^Signed-off-by: .+ <(${author_email//./\\.}|${committer_email//./\\.})>\$" || true)

            if [ -z "$match" ]; then
              subject=$(git log -1 --format='%s' "$sha")
              echo "::error::commit $sha (\"$subject\") has no Signed-off-by trailer matching its author ($author_email) or committer ($committer_email) email."
              failed=1
            else
              echo "$sha: ok ($match)"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing a DCO sign-off. Fix with:"
            echo "  git commit --amend -s --no-edit        # last commit only"
            echo "  git rebase --signoff ${BASE_SHA}        # every commit on this branch"
            echo "See CONTRIBUTING.md#developer-certificate-of-origin."
            exit 1
          fi
