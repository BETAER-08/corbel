[workspace]
members = ["crates/corbel-core", "crates/corbel-lang", "crates/corbel"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/BETAER-08/corbel"
authors = ["BETAER"]

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
ignore = "0.4.31"
rayon = "1.12.0"
clap = { version = "4.6.4", features = ["derive"] }
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
panic = "abort"
